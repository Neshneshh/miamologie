async function shrink(f,mx){const bm=await createImageBitmap(f),k=Math.min(1,mx/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error('image illisible')),'image/jpeg',.85))}
const eanOk=c=>{if(!/^\d{8}$|^\d{12,13}$/.test(c))return false;const d=[...c].map(Number),ck=d.pop();let s=0;d.reverse().forEach((x,i)=>s+=x*(i%2?1:3));return(10-s%10)%10===ck};
async function scanF(i){const f=i.files[0],e=$('#serr');if(!f)return;e.textContent='';let code=null;
try{if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}).detect(await createImageBitmap(f));if(r.length)code=r[0].rawValue}}catch(x){}
if(!code)try{if(window.Html5Qrcode)code=await new Html5Qrcode('qr').scanFile(f,false)}catch(x){}
i.value='';if(!code){e.textContent='Code non lu. Recadre le code-barres net et bien éclairé, ou saisis les chiffres.';return}
$('#bc').value=code;if(!eanOk(code))e.textContent='Ce code semble mal lu (clé de contrôle invalide) : vérifie les chiffres.';lookup()}
async function readLabel(inp){const fs=[...inp.files].slice(0,3),m=$('#lbm');if(!fs.length)return;m.textContent='Claude lit l\'étiquette…';

const bl=await Promise.all(fs.map(f=>shrink(f,1600))),keys=NU.concat(MC).map(n=>`${n.k} (${n.u})`).join(', ');
const r=await sm.json(`Tu lis des photos d'un produit alimentaire (emballage, tableau nutritionnel, code-barres). Réponds uniquement par un objet JSON : {"name":string|null,"brand":string|null,"barcode":string|null,"kcal":number|null,"values":{clé:nombre}}. "barcode" = les chiffres imprimés sous le code-barres, seulement s'ils sont nets. "kcal" = kcal pour 100 g (ou 100 ml). Clés possibles de "values" : ${keys}. Ne recopie QUE des valeurs réellement imprimées et lisibles, converties pour 100 g ou 100 ml ; si le tableau n'est donné que par portion, mets null. N'invente et n'estime rien : null en cas de doute.`,{images:bl});
const ok=v=>typeof v=='number'&&isFinite(v)&&v>=0;let n=0;

if(ok(r.kcal)){$('#pk').value=r.kcal;n++}
NU.concat(MC).forEach(u=>{const v=r.values&&r.values[u.k];if(ok(v)){$('#v_'+u.k).value=v;n++}});

for(const q of [q0,q1]){if(q.length<2)continue;const r=srch(q,1);if(r.length&&r[0]<1e5&&nz(F[r[0]][0]).replace(/[^a-z ]/g,' ').split(/\s+/).some(w=>w.replace(/(s|x)$/,'')==q.split(' ')[0].replace(/(s|x)$/,'')))return r[0]}return null}
function shopParse(txt){let s=' '+nz(txt)+' ';s=s.replace(/\b(salut|bonjour|alors|voila)\b/g,' ').replace(/\b(j'ai|j ai|je viens d'|je viens de|on a|nous avons|ai|avons)\s/g,' ').replace(/\b(achete|achetes|acheter|pris|prise|recupere|trouve|rapporte|ramene)\b/g,' ');
const out=[];s.split(/,|;|\bet\b|\bpuis\b|\baussi\b|\bainsi que\b|\bplus\b/).forEach(p=>{p=p.trim().replace(/\s+/g,' ');
const re=new RegExp('^(?:(?:\\d+(?:[.,]\\d+)?\\s*|(?:'+NUMW+')\\s+))?(?:(?:'+UNITW+')\\s+)?(?:(?:de la|du|des|de|le|la|les|un|une)\\s+|(?:de l|d|l)\')?');let k=0;while(k++<3){const q=p.replace(re,'');if(q==p)break;p=q}
p=p.replace(/[^a-z0-9' -]/g,'').trim();if(p.length>=2)out.push(p)});return out}

let ex=S.shop.find(x=>(f!=null&&x.f===f)||nz(x.n)==nz(nm)||nz(x.n)==nz(w)||(nz(x.n).startsWith(nz(w).replace(/(s|x)$/,''))&&w.length>2));
if(ex){ex.done=true}else{shopAdd(nm,f);const y=S.shop.find(x=>nz(x.n)==nz(nm));if(y)y.done=true}c++});

const PAL={sed:1.3,leg:1.45,mod:1.6,act:1.75,tres:1.9};
function calEst(){const a=ageOf(),h=+S.p.h,w=lastW(),miss=[];if(a===''||a<18)miss.push(a===''?'ta date de naissance':'minor');if(!(h>=100&&h<=230))miss.push('ta taille');if(!w)miss.push('ton poids');
if(miss.length)return{miss};const s=S.p.sex=='m'?5:S.p.sex=='f'?-161:-78,bmr=10*w+6.25*h-5*a+s,pal=PAL[S.p.act]||1.5,m=Math.round(bmr*pal/50)*50,r={kcal:m,bmr:Math.round(bmr),pal};
const g=+S.p.wg;if(S.p.wt&&g>0){const bmiG=g/((h/100)**2),diff=g-w,rate=+S.p.wr||.25;
if(Math.abs(diff)<.5)r.plan={kcal:m,dir:0,note:'Ton poids visé est proche de ton poids actuel : je garde tes besoins d\'entretien.'};
else if(S.p.preg&&S.p.preg!='non')r.plan={kcal:m,dir:0,note:'Pendant la grossesse ou l\'allaitement, je ne propose pas de déficit : parles-en à ta sage-femme ou ton médecin.'};
else if(diff<0&&bmiG<18.5)r.plan={kcal:m,dir:0,note:'Ce poids visé correspond à un IMC inférieur à 18,5, sous la zone de poids de santé : je ne propose pas de déficit. Un professionnel de santé peut t\'accompagner si tu y réfléchis.'};
else{const dir=diff<0?-1:1,d=Math.round(rate*7700/7/50)*50;let k=m+dir*d,note='';if(dir<0){const cap=Math.round(m*.75/50)*50;if(k<cap)k=cap;if(k<1500){k=Math.min(m,1500);note=' J\'ai limité l\'objectif à 1 500 kcal : en dessous, ce serait un risque pour la santé.'}}
r.plan={kcal:k,dir,rate,weeks:Math.ceil(Math.abs(diff)/rate),diff:Math.round(Math.abs(diff)*10)/10,note}}}
return r}

else b+=`<p class=sm>Estimation de tes besoins : ≈ <b>${e.kcal} kcal/jour</b> (âge, taille, poids, activité ; formule de Mifflin-St Jeor et coefficients d'activité usuels). C'est un repère moyen pour un profil comme le tien, pas une prescription.</p>${planHTML(e)}${S.p.kg!=(e.plan?e.plan.kcal:e.kcal)?`<button class=ghost onclick="calSet(${e.plan?e.plan.kcal:e.kcal})">Utiliser ${e.plan?'cette proposition':'l\'estimation'}</button>`:''}`;

function ideaShop(){const dn=have(),rm=recMatch();
if(!dn.length)return`<div class=card><p>Coche ce que tu as acheté pour voir des recettes avec.</p><button onclick="go('shop')">Aller aux courses</button></div>`;

function dayGap(ms){const dn=dayN(ms);return NU.map((n,j)=>{const r=rfn(n),z=dn[j],kn=z.d>0;return{n,r,s:z.s,kn,gap:r&&kn?Math.max(0,r*.85-z.s):0}})}
function sc(nvf,G,g){let s=0,why=[];G.forEach(z=>{if(z.gap<=0)return;const v=nvf(z.n.k);if(v==null)return;const c=v*g/100;if(c<=0)return;s+=Math.min(1,c/z.gap)*(z.n.k=='pr'&&S.p.goals.includes('prot')?1.5:1);if(c/z.r>=.1)why.push(`${z.n.l} +${Math.round(c/z.r*100)} %`)});return{s,why}}
function suggest(G,pl){const out=[];F.forEach((f,i)=>{if(DEL.has(i)||!allowed(i)||pgBad(i))return;if(i>=1e5){if(pl!='all')return;if(BAD.test(nzc(i)))return}
let kn=0;NU.forEach(n=>{if(nv(i,n.k)!=null)kn++});if(kn<(i>=1e5?8:5))return;const us=unitsOf(i),g=us?us[0][1]:100,r=sc(k=>nv(i,k),G,g);if(r.s>0)out.push({i,g,lab:us?`1 ${us[0][0]} (≈ ${g} g)`:'100 g',s:r.s,why:r.why})});
out.sort((a,b)=>b.s-a.s);const seen=new Set(),res=[];for(const o of out){const k=nzc(o.i).split(/[ ,]/).slice(0,2).join(' ');if(seen.has(k))continue;seen.add(k);res.push(o);if(res.length>=8)break}return res}
function ideaNext(){const ms=S.meals.filter(x=>x.d===T());
if(!ms.length)return`<div class=card><h2>Que manger ensuite ?</h2><p>Rien n'est noté aujourd'hui : je n'ai rien à comparer. Note un repas, ou pars d'une idée de recette.</p><button onclick="itab='rec';render()">Voir des recettes</button></div>`;
const G=dayGap(ms),kn=G.filter(z=>z.kn).length;

function friFind(){const q=nz(FQ).trim();if(q.length<2)return'';return srch(q,12).filter(i=>i<1e5&&allowed(i)).slice(0,6).map(i=>`<button class=ghost onclick="friAdd(${i})">+ ${esc(F[i][0].slice(0,30))}</button>`).join('')}
function friMatch(){const fr=new Set(fridge());if(!fr.size)return[];return builtin().map(r=>{const need=r.items.filter(x=>!STAPLE.test(nz(F[x.f][0]))),ok=need.filter(x=>fr.has(x.f)),miss=need.filter(x=>!fr.has(x.f));return{r,ok,miss,p:need.length?ok.length/need.length:0}}).filter(m=>m.ok.length>0&&m.p>=.5).sort((a,b)=>b.p-a.p||a.miss.length-b.miss.length).slice(0,30)}
function friMiss(id){const m=friMatch().find(x=>x.r.id==id);if(!m)return;m.miss.forEach(x=>shopAdd(F[x.f][0],x.f,x.g));flash='Ajouté à ta liste';save();render()}
function ideaFri(){const fr=fridge().filter(i=>F[i]),m=friMatch();
return`<div class=card><h2>Qu'est-ce que j'ai dans le frigo ?</h2><input type=search placeholder="Ajouter un aliment (ex. œufs, courgette)" value="${esc(FQ)}" oninput="fqSet(this.value)" style="margin:8px 0"><div class=ck id=fq>${friFind()}</div>${fr.length?`<div class=ck>${fr.map(i=>`<button onclick="friDel(${i})">${esc(F[i][0].slice(0,26))} ✕</button>`).join('')}</div>`:'<p class=sm>Ajoute ce que tu as sous la main : je te propose des recettes.</p>'}</div>`+m.map(x=>`${x.miss.length?`<p class=sm style="margin:14px 2px 0">Il te manque : ${x.miss.map(z=>esc(fdisp(F[z.f][0],'s'))).join(', ')} <button class=ghost onclick="friMiss('${x.r.id}')">+ Courses</button></p>`:`<p class=sm style="margin:14px 2px 0">✓ Tu as tout</p>`}${recCard(x.r,false)}`).join('')+(fr.length&&!m.length?'<p class=sm>Pas encore de recette avec ces aliments : ajoutes-en un ou deux de plus.</p>':'')}

function bkCard(){const cl=!!(window.claude&&claude.use);return`<div class=card><h2>Sauvegarde</h2><p class=sm>${cl?'<span id=syn>'+syn()+'</span> ':''}Tes données sont gardées sur cet appareil. Exporte-les de temps en temps pour ne rien perdre si tu changes de téléphone.</p>${cl?'<button class=ghost onclick="SY.st=\'sync\';upd();push(true)">Sauvegarder maintenant</button>':''}<button class=ghost onclick="bkOut()">Exporter mes données</button><label class=btn-l style="display:block"><input type=file accept=".json,application/json" hidden onchange="bkIn(this)"><span class=ghost style="display:block;text-align:center;padding:.6rem;border-radius:12px;cursor:pointer">Importer une sauvegarde</span></label><p id=bkm class=sm></p></div>`}
function bkOut(){try{const o={app:'miamologie',v:1,s:JSON.parse(LS.g('bn')||'null'),c:JSON.parse(LS.g('bnC')||'null')},bl=new Blob([JSON.stringify(o)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='miamologie-'+T()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);$('#bkm').textContent='Fichier exporté.'}catch(e){$('#bkm').textContent='Export impossible ici.'}}
async function bkIn(inp){const f=inp.files&&inp.files[0],m=$('#bkm');if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!='miamologie'||!o.s||!o.s.p)throw 0;LS.s('bn',JSON.stringify(o.s));if(o.c)LS.s('bnC',JSON.stringify(o.c));m.textContent='Sauvegarde importée, rechargement…';setTimeout(()=>location.reload(),600)}catch(e){m.textContent='Ce fichier n\'est pas une sauvegarde Miamologie.'}inp.value=''}
